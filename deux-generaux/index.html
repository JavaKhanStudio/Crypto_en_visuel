<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deux généraux — Crypto en visuel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
  <link rel="stylesheet" href="../ficelle/lib/episode.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../ficelle/vendor/three/three.module.min.js",
        "three/addons/": "../ficelle/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="bubbles"></div>

  <header id="topbar">
    <div class="brand">
      <span class="crest">⚔</span>
      <div>
        <a class="series" href="../" data-i18n="series">Crypto en visuel</a>
        <h1 data-i18n="title">Le problème des deux généraux</h1>
        <p data-i18n="subtitle">Peut-on se mettre d'accord quand chaque message peut se perdre ?</p>
      </div>
    </div>
    <nav id="modes">
      <button data-mode="story" class="active" data-i18n="mode.story">Histoire</button>
      <button data-mode="sandbox" data-i18n="mode.sandbox">Bac à sable</button>
      <button data-mode="quiz" data-i18n="mode.quiz">Quiz</button>
    </nav>
    <div class="right">
      <button id="sound" class="icon" title="Son" aria-label="Son">🔈</button>
      <div id="lang" role="group" aria-label="Langue">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <!-- Story mode -->
  <section id="story" class="panel bottom">
    <div class="chapters" id="chapters"></div>
    <div class="narration">
      <h2 id="step-title"></h2>
      <div id="step-text" class="step-text"></div>
      <div class="tiles" id="step-tiles"></div>
    </div>
    <div class="actions" id="step-actions"></div>
    <div class="nav">
      <button id="prev" data-i18n="nav.prev">◀ Précédent</button>
      <span id="step-count"></span>
      <button id="next" class="primary" data-i18n="nav.next">Suivant ▶</button>
    </div>
  </section>

  <!-- Sandbox mode -->
  <section id="sandbox" class="panel side hidden">
    <h2 data-i18n="sb.title">Bac à sable</h2>
    <p class="hint" data-i18n="sb.hint">Envoyez des messagers, réglez le danger, et regardez la certitude ne jamais arriver.</p>

    <fieldset>
      <legend data-i18n="sb.messengers">Messagers</legend>
      <div class="row">
        <button id="sb-send-a" class="team-a" data-i18n="sb.sendA">Alice envoie ▶</button>
        <button id="sb-send-b" class="team-b" data-i18n="sb.sendB">◀ Bob répond</button>
      </div>
      <div class="row">
        <button id="sb-auto" data-i18n="sb.auto">Protocole automatique</button>
        <button id="sb-burst" data-i18n="sb.burst">Rafale de 10</button>
      </div>
      <label class="slider">
        <span data-i18n="sb.danger">Probabilité de capture</span>
        <input id="sb-p" type="range" min="0" max="100" value="40">
        <output id="sb-p-out">40 %</output>
      </label>
      <label class="check"><input id="sb-next-caught" type="checkbox"> <span data-i18n="sb.nextCaught">Le prochain messager sera capturé</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="sb.dawn">L'aube</legend>
      <label class="select">
        <span data-i18n="sb.rule">Chaque général attaque s'il a reçu au moins</span>
        <select id="sb-rule">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
        </select>
        <span data-i18n="sb.ruleEnd">message(s)</span>
      </label>
      <button id="sb-dawn" class="primary" data-i18n="sb.dawnGo">Lever le soleil ☀</button>
    </fieldset>

    <div class="row">
      <button id="sb-reset" data-i18n="sb.reset">Réinitialiser</button>
      <button id="sb-follow" data-i18n="sb.follow">Suivre le messager</button>
    </div>
    <div id="sb-stats" class="stats"></div>
  </section>

  <!-- Knowledge ladder, shared by story and sandbox -->
  <aside id="ladder" class="panel ladder">
    <h3 data-i18n="ladder.title">Qui sait quoi ?</h3>
    <ol id="ladder-rungs"></ol>
    <p id="ladder-verdict"></p>
  </aside>

  <!-- Quiz mode -->
  <section id="quiz" class="modal hidden" role="dialog" aria-modal="true">
    <div class="card">
      <div class="quiz-head">
        <span id="quiz-progress"></span>
        <span id="quiz-score"></span>
      </div>
      <h2 id="quiz-q"></h2>
      <p id="quiz-multi" class="hint"></p>
      <ol id="quiz-options" type="A"></ol>
      <div id="quiz-feedback"></div>
      <div class="nav">
        <button id="quiz-check" class="primary" data-i18n="quiz.check">Valider</button>
        <button id="quiz-next" class="primary hidden" data-i18n="quiz.next">Question suivante ▶</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><p data-i18n="loading">Construction des châteaux…</p></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
