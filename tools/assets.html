<!doctype html>
<!-- Asset lab (r29): the riders and a guard alone on a turntable, animated exactly as
     in the demo (gallop() from deux-generaux/js/messenger.js). Serve the repo root, open
     tools/assets.html; ?freeze=<seconds> stops the clock at that time, ?yaw=<rad>
     fixes the turntable, ?only=<name> shows one asset. Headless: tools/shoot_assets.py. -->
<html><head><meta charset="utf-8"><title>Asset lab</title>
<style>body{margin:0;background:#20242e;overflow:hidden}#l{position:fixed;bottom:8px;width:100%;display:flex;justify-content:space-around;color:#ccd;font:14px sans-serif}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body><div id="l"></div>
<script type="module">
import * as THREE from 'three';
import { buildRider, guard, gallop } from '../deux-generaux/js/messenger.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3040);
scene.add(new THREE.HemisphereLight(0xc8d6ff, 0x3a2e22, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(5, 10, 8); scene.add(sun);
const assets = [['rider A', buildRider('a')], ['rider B', buildRider('b')], ['forged', buildRider('a', true)], ['guard', guard()]]
  .filter(([n]) => !q.get('only') || n === q.get('only'));
const gap = 7, x0 = -(assets.length - 1) * gap / 2;
assets.forEach(([name, o], i) => { o.position.x = x0 + i * gap; scene.add(o); document.getElementById('l').insertAdjacentHTML('beforeend', `<span>${name}</span>`); });
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .1, 200);
camera.position.set(0, 6, 7 + assets.length * 4.5); camera.lookAt(0, 2.6, 0);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = q.has('freeze') ? +q.get('freeze') : clock.getElapsedTime();
  for (const [, o] of assets) {
    o.rotation.y = q.has('yaw') ? +q.get('yaw') : t * .5;
    if (o.userData.body) gallop(o.userData, t);
  }
  renderer.render(scene, camera);
});
window.lab = { ready: true, assets };
</script></body></html>
