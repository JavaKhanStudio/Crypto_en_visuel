<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le paquet complet — Crypto en visuel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="../lib/episode.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/three.module.min.js",
        "three/addons/": "../vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="veil"></div>
  <div id="bubbles"></div>

  <header id="topbar">
    <div class="brand">
      <span class="crest">📦</span>
      <div>
        <a class="series" href="../" data-i18n="series">Crypto en visuel</a>
        <h1 data-i18n="title">Le paquet complet</h1>
        <p data-i18n="subtitle">Les quatre briques dans l’ordre : Alice ferme, Bob vérifie avant de déchiffrer, Eve est prise.</p>
      </div>
    </div>
    <nav id="modes">
      <button data-mode="story" class="active" data-i18n="mode.story">Histoire</button>
      <button data-mode="sandbox" data-i18n="mode.sandbox">Bac à sable</button>
      <button data-mode="quiz" data-i18n="mode.quiz">Quiz</button>
    </nav>
    <div class="right">
      <button id="sound" class="icon" title="Son" aria-label="Son">🔈</button>
      <div id="lang" role="group" aria-label="Langue">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <!-- Story mode -->
  <section id="story" class="panel bottom">
    <div class="chapters" id="chapters"></div>
    <div class="narration">
      <h2 id="step-title"></h2>
      <p id="step-text"></p>
      <button id="step-more" type="button"></button>
    </div>
    <div class="actions" id="step-actions"></div>
    <div class="nav">
      <button id="prev" data-i18n="nav.prev">◀ Précédent</button>
      <span id="step-count"></span>
      <button id="next" class="primary" data-i18n="nav.next">Suivant ▶</button>
    </div>
  </section>

  <!-- Sandbox mode -->
  <section id="sandbox" class="panel side hidden">
    <h2 data-i18n="sb.title">Bac à sable</h2>
    <p class="hint" data-i18n="sb.hint"></p>
    <fieldset>
      <legend data-i18n="sb.order">L'ordre</legend>
      <input id="sb-order" type="text" maxlength="60" spellcheck="false">
    </fieldset>
    <fieldset>
      <legend data-i18n="sb.eve">Eve</legend>
      <label class="check"><input type="radio" name="sb-eve" value="pass"> <span data-i18n="sb.pass"></span></label>
      <label class="check"><input type="radio" name="sb-eve" value="flip" checked> <span data-i18n="sb.flip"></span></label>
      <div class="bricks">
        <label class="check"><input type="radio" name="sb-brick" value="ek"> <span data-i18n="card.fields.ek"></span></label>
        <label class="check"><input type="radio" name="sb-brick" value="iv"> <span data-i18n="card.fields.iv"></span></label>
        <label class="check"><input type="radio" name="sb-brick" value="ct" checked> <span data-i18n="card.fields.ct"></span></label>
        <label class="check"><input type="radio" name="sb-brick" value="tag"> <span data-i18n="card.fields.tag"></span></label>
      </div>
      <label class="byte"><span data-i18n="sb.byte"></span> <input id="sb-byte" type="number" min="1" max="32" value="1"></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="sb.bob">Bob</legend>
      <label class="check"><input type="radio" name="sb-bob" value="check" checked> <span data-i18n="sb.check"></span></label>
      <label class="check"><input type="radio" name="sb-bob" value="decrypt"> <span data-i18n="sb.decrypt"></span></label>
    </fieldset>
    <div class="row">
      <button id="sb-send" class="primary team-a" data-i18n="sb.send">Envoyer le messager ▶</button>
    </div>
    <div id="sb-stats" class="stats"></div>
  </section>

  <!-- The corner card: the packet, Alice's four moves, Bob's three, Eve's byte, the code -->
  <aside id="card" class="panel"></aside>

  <!-- Quiz mode -->
  <section id="quiz" class="modal hidden" role="dialog" aria-modal="true">
    <div class="card">
      <div class="quiz-head">
        <span id="quiz-progress"></span>
        <span id="quiz-score"></span>
      </div>
      <h2 id="quiz-q"></h2>
      <p id="quiz-multi" class="hint"></p>
      <ol id="quiz-options" type="A"></ol>
      <div id="quiz-feedback"></div>
      <div class="nav">
        <button id="quiz-check" class="primary" data-i18n="quiz.check">Valider</button>
        <button id="quiz-next" class="primary hidden" data-i18n="quiz.next">Question suivante ▶</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>
  <div id="loading"><div class="spinner"></div><p data-i18n="loading">Construction des châteaux…</p></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
