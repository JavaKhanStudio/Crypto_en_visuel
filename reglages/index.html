<!doctype html>
<!-- r646 PROTOTYPE (asked of Simon before any link to it): the series' settings, one page, kept in localStorage
     like every episode reads them: 'dg-quality' (lib/quality.js LEVELS), 'dg-still' (r546: 30 or 60 frames a
     second when the scene is still), 'dg-lang'. ?lang=en. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réglages · Crypto en visuel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
  <link rel="stylesheet" href="../home.css">
  <style>
    main#settings { max-width: 720px; margin: 0 auto; padding: 0 18px 40px; display: grid; gap: 14px; }
    .back { display: inline-block; margin: 18px 0 0 18px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--gold); }
    .row { background: var(--glass); border: 1px solid var(--edge); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; }
    .row h2 { margin: 0; font: 600 18px var(--serif); color: var(--ink); }
    .row p { margin: 0; color: var(--muted); }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg button { flex: 1 1 0; min-width: 0; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(255,255,255,.05);
      color: var(--ink); font: 600 15px var(--sans); cursor: pointer; display: grid; gap: 2px; }
    .seg button small { font-weight: 400; color: var(--muted); font-size: 12px; }
    .seg button.on { background: var(--gold); color: #1b1405; border-color: var(--gold); }
    .seg button.on small { color: #4a3510; }
    .note { font-size: 13px; color: var(--muted); }
    #reset { justify-self: start; background: none; border: 1px solid var(--edge); color: var(--muted); border-radius: 10px; padding: 8px 12px; cursor: pointer; font: inherit; }
    #reset:hover { color: var(--gold); border-color: var(--gold); }
    header { padding-bottom: 6px; }
  </style>
</head>
<body>
  <a class="back" href="../" data-i18n="back">← Tous les épisodes</a>
  <header>
    <span class="crest">⚙️</span>
    <h1 data-i18n="title">Réglages</h1>
    <p class="tagline" data-i18n="tagline">Gardés sur cet appareil, pour tous les épisodes.</p>
  </header>
  <main id="settings"></main>
  <footer data-i18n="footer">Un épisode déjà ouvert prend les nouveaux réglages au prochain chargement.</footer>
  <script type="module" src="settings.js"></script>
</body>
</html>
