p are #demo3d's (r117), not this tag's: do not edit home.js or README.md here. tests/bubble_room.py and tests/card_dock.py are run with the slug as argument (python3 tests/bubble_room.py enigma-reglage), until r117 adds it to their lists. Cast: Alice, Bob, Eve.
