em, no page error) says all ok. ROOM PARTS (r485): lib/room-parts.js is the one copy of what a room is made of: litTile (1.2-1.3's lit tile), tile/face/paint/glyph (1.4-1.6's unlit shared faces; ink { fg, bg, size = 74, letter, blank }), label/relabel/show, and buildRoom(scene, portrait, { tall } | { rows, cols, cx } | { size, owner }) (the three stone-room layouts, 1.6's with banners); an episode's js/inside.js imports them and keeps only its INK and its rooms. A look one episode needs is an option there, never a tileTex/face/label/buildRoom function back in an episode. Check after a change: tools/room_parts_diff.py <out> <before-url> <after-url> (every room step, 1440 and 390, seeded, held) says 0%. SHARED FILES (r431): the home door's picture is assets/doors/home.jpg (home-2.jpg the older shot 1.3 and aes-interieur keep; paquet-complet keeps its own img/door-home.jpg), named img: '../assets/doors/home.jpg' in story.js, written there by tools/door_thumbs.py; the hover clips img/door-home.mp4 differ per episode and stay. lib/rsa.js is the one RSA + OAEP of 1.4-1.6, imported '../../lib/rsa.js'. Still a copy: enigma/js/world.js = enigma-reglage/js/world.js (its own ticket).
