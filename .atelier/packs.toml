[tags.sel]
label = 'Épisode 7, Le sel'
description = "Episode 7 of Crypto en visuel, the salt and bcrypt's slowness, in sel/"
context = """
EPISODE 7, Le sel (et la lenteur de bcrypt), folder sel/, with the values of the course card « Mots de passe - Le sel »: Alice and Bob both register with password, MD5 5f4dcc3b for both, the base leaks, Eve's precomputed table finds it; salts x7k2m and r3n8q stuck at the end (the slide writes password+x7k2m, MD5 receives passwordx7k2m: the + is NOT in the input) give cffbee8f and 648c5237; Eve then tries one by one at over ten billion a second; bcrypt rounds=12 (0.24 s a hash on Simon's machine) brings her to a few thousand a second, but password still falls first. 13 steps in 6 chapters, sandbox (« Mesurer » times a real bcrypt and MD5 in the browser, in a worker, sel/js/worker.js), quiz of 7. sel/js/hash.js is a real MD5 and a real bcrypt (Blowfish tables computed from pi's digits via BigInt). Tests: node tests/sel_values.mjs (slides, RFC 1321, Python's bcrypt), tests/sel_story.py. Cast: Alice, Bob, Eve.
SHARED (the same in every episode pack of this board): the series « Crypto en visuel » / 'Crypto, Visualized' (r15) for the Cryptographie course, STATIC pages, no build step, repo ~/Documents/GitHub/deux-generaux. Stay inside your episode's folder: the root (index.html, home.js, home.css), vendor/ and the other episodes belong to #demo3d and their own tags; a change there needs a #demo3d ticket (atelier add --tags demo3d). three.js r170 is shared in vendor/ (importmap '../vendor/three/...'), never copied or upgraded from an episode. The episode's address /sel/ never moves (slide cards point to it); its number, slug and live: true are its EPISODES entry in home.js, its title and one-liner the ep.sel entries of home.js's fr AND en dicts, its row and section in README.md (keep the section true when you change the story, step count or quiz). Deep links: #story=N is a STEP of this episode, #sandbox, #quiz, ?lang=en, ?instant=1 (skips camera flights). The language is shared across the series through localStorage 'dg-lang'.
Every visible word is in sel/js/i18n.js (fr and en dicts), the quiz in sel/js/quiz-data.js. TRAP: a key missing from en silently shows the French text (raw() falls back to dicts.fr), so add every key to both. The series label (i18n key 'series') links back to the home.
Values (D4): a crypto episode takes its numbers from the course deck's worked-example slides and computes them in-page with a real algorithm, checked by tests/sel_values.mjs (node) when there is one; recompute a slide value before trusting it.
TRAP that happened (2bdb831): headless SwiftShader runs at a low frame rate, so a check like |u - end| < eps on per-frame motion is jumped over and the event never fires: test against a threshold (u >= .965), never a window. A per-letter await inside a 'quick' loop is a headless-speed killer: collapse it to one wait. For a mid-animation shot load ?instant=1, then set demo.stage.speed=1 and trigger the action.
PUBLIC: origin = github.com/JavaKhanStudio/Crypto_en_visuel, GitHub Pages from main at https://javakhanstudio.github.io/Crypto_en_visuel/ (a push publishes in about a minute); the course deck links to it, so a broken push breaks the course. Publishing is approved (r2): push your own commit to origin main once checked.
Gate: serve the repo (python3 -m http.server 8793), then python3 tests/sel_story.py (fr, then with en as 2nd arg) must pass, and tools/shoot.py out/name --page sel/ --hash '#story=N' prints page errors, which must be none. Attach the PNG to the ticket (atelier attach), and close a change Simon can see with atelier done --livrable "<what to look at, one line>": a ticket an agent filed reaches his Notif ONLY that way, a picture alone does not (r51). sel/vignette.jpg (640x360, tools/vignette.py sel) is the home card: without it the home 404s. After pushing, rerun shoot.py with --base https://javakhanstudio.github.io/Crypto_en_visuel/. Never open a browser on Simon's desk.
"""

[tags.garde]
label = 'Épisode 8, Le garde'
description = 'Episode 8 of Crypto en visuel, the hasty guard (HMAC timing attack), in garde/'
context = """
EPISODE 8, Le garde trop pressé (HMAC, timing attack), folder garde/, with the values of the course cards « HMAC » and « HMAC - La timing attack »: key cle_secrete_partagee, message « Transfert 1000 euros a Bob », HMAC-SHA256 1598e59f...; Eve's order « ...a Eve » is b2ef0922...; the guard compares with ==, which stops at the first differing character, so Eve times the 16 hex letters at each position (at most 64 x 16 = 1 024 tries instead of 16^64); hmac.compare_digest always looks at all 64. 10 steps in 5 chapters, sandbox (Eve's order, == or compare_digest, launch the attack), quiz of 6. garde/js/hmac.js is a real SHA-256 (FIPS 180-4) and HMAC-SHA256 (RFC 2104). Tests: node tests/garde_values.mjs (node:crypto, Python's values), tests/garde_story.py. Cast: Alice, Bob, Eve, the guard.
