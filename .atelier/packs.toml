Gate: serve the repo (python3 -m http.server 8793), then tools/shoot.py out/name --page deux-generaux/ --hash '#story=N' prints page errors, which must be none. Attach the PNG to the ticket (atelier attach), and close a change Simon can see with atelier done --livrable "<what to look at, one line>": a ticket an agent filed reaches his Notif ONLY that way, a picture alone does not (r51). deux-generaux/vignette.jpg (640x360, tools/vignette.py deux-generaux) is the home card: without it the home 404s. After pushing, rerun shoot.py with --base https://javakhanstudio.github.io/Crypto_en_visuel/. Never open a browser on Simon's desk.
