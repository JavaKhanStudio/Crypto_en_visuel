# Crypto en visuel's TAGS AND THEIR CONTEXT PACKS (board slug deux-generaux): split off board 'cryptographie' on 2026-10-16 (#demo3d).
# Only [tags.<slug>] tables belong in this file.

[tags.demo3d]
label = 'Démo 3D'
description = 'The series Crypto en visuel: crypto told as little 3D stories, static Three.js pages published on GitHub Pages'
context = """
SCOPE (r44, r115): the board leases ONE session per tag, so everything #demo3d holds waits behind its running ticket; keep it small. #demo3d is the series home (index.html, home.js, home.css), the shared vendor/ and tools/, and the series-wide DESIGN of a change (prototyped on one episode, asked of Simon). Each episode has its own tag named after its folder (deux-generaux, eve-lit-tout, octet-change, cle-vallee, paquet-complet, encore-des-tours, cadenas, diffie-hellman, scytale, enigma, enigma-reglage, enigma-casse, pingouin, sel, garde), with its own pack: a ticket on one episode carries that tag ALONE, so episodes run side by side. A change across episodes is NOT one #demo3d ticket: once its design is approved, raise one child per episode on that episode's tag (--parent the design ticket, --after it). A NEW episode gets its own tag when it is queued, not when built: add its [tags.<slug>] block (copy the SHARED paragraph of any episode pack) in the commit that queues it; the episode is built under that tag, and only its home.js EPISODES/ep.<slug> entries, tests/home_links.py SOON and README row are a small #demo3d ticket --after it.
The series « Crypto en visuel » / 'Crypto, Visualized' (r15: crypto ideas told as little 3D stories) for the Cryptographie course: STATIC pages, no build step, its own repo ~/Documents/GitHub/deux-generaux. LAYOUT (r34): the root index.html + home.js + home.css is the series home (one card per episode; EPISODES in home.js fixes each episode's number and slug, live: true = linked; TAGS in home.js lists the concepts each episode shows, labels under tags in fr and en, r191: a new episode gets its line there); SAGA (r94): episode 1 is « La saga des deux généraux », 1.1 to 1.6 (n: '1.1', saga: 1 in EPISODES), drawn as one .saga block under « Épisode 1 »; its folders are deux-generaux, eve-lit-tout, octet-change, cle-vallee, paquet-complet, encore-des-tours (all six built, r99), and tests/home_links.py SOON lists the stubs (none now): drop a slug from SOON when its episode goes live; each episode lives in its own folder /<slug>/ whose address never moves (slide cards point to it; table in README.md); three.js r170 is shared in vendor/ at the root (importmap '../vendor/three/...'). An episode not built yet has a stub <slug>/index.html that forwards to its card on the home; the episode's real page replaces the stub. home.js forwards the OLD root links (#story=N, #sandbox, #quiz, #shot=) to deux-generaux/: keep that, the course gave them out.
Episode 1, Two Generals, is deux-generaux/ (index.html, css/, js/); its series label (i18n key 'series') links back to the home. deux-generaux/js/main.js wires the renderer and the three modes (story, sandbox, quiz); window.demo is the debug handle. Deep links inside an episode: #story=N is a STEP of that episode (not an episode number), #sandbox, #quiz, ?lang=en, ?instant=1 (skips camera flights). The language is shared across the series through localStorage 'dg-lang'.
PUBLIC: origin = github.com/JavaKhanStudio/Crypto_en_visuel, GitHub Pages from main at https://javakhanstudio.github.io/Crypto_en_visuel/ (a push publishes in about a minute). The course deck links to it, so a broken push breaks the course. Publishing is approved (r2): push your own commit to origin main once checked. The slide's link to it lives on the cryptographie board's #slides tag.
What Simon wants (r22): easy to see, buttons to try things, little speech bubbles at each step, impressive on purpose, FR first plus EN, clean camera moves, a quiz. Simple code, rich rendering.
Every visible word of Two Generals is in deux-generaux/js/i18n.js (fr and en dicts); its quiz is deux-generaux/js/quiz-data.js; the home's words are the fr/en dicts in home.js. TRAP: a key missing from en silently shows the French text (raw() falls back to dicts.fr), so add every key to both. RULE (r80, Simon: « anywhere, ever in this project »): no visible word, FR or EN, story, card or quiz, refers to the slides or the course (« la diapositive », « the slide », « dans le cours »): the page stands on its own; say the fact itself. Code comments citing a slide as a source may stay. Check: python3 tests/no_slide_refs.py (scans every episode's i18n.js and quiz-data.js) says all ok. BUBBLES (r84): js/bubbles.js settle() moves each speech bubble off the others and off the ids in WALLS (top bar, modes, lang, sound, card, panels); a new fixed overlay a bubble must not cover goes into WALLS, and tests/bubble_room.py (every step, phone and desktop) must stay all ok. PHONE ROOM (r84, Simon's pick C): under 900px the top controls sit in two rows (title + FR/EN, then modes + sound, a grid in style.css) and the corner #card is folded to its title line (class folded, a tap on its h3 opens it, main.js); tests/card_dock.py checks both. Do not put a third row of controls back on a phone.
The cast: Alice (A, west), Bob (B, east), Eve (E, the city), « le Chroniqueur » (Simon r89: renamed from Arnaud/Bastien/Étienne by r92; Alice and Eve are women, so French agreement follows). Names are under who: AND written inline in many fr/en strings; French agreement and the qu'/que elision in knows() follow them. Renaming is Simon's choice: ask first, r3: « I asked you to confirm with me first. ».
TRAP that happened (2bdb831): headless SwiftShader runs at a low frame rate, so a check like |u - end| < eps on per-frame motion is jumped over and the event never fires. Test against a threshold (u >= .965), never a window.
Gate: serve the repo (python3 -m http.server 8793), then tools/shoot.py out/name --hash '#story=N' (opens deux-generaux/ by default; --page '' for the home, --page <slug>/ for another episode); it prints page errors, which must be none. Attach the PNG to the ticket (atelier attach), and close a change Simon can see with atelier done --livrable "<what to look at, one line>": a ticket an agent filed reaches his Notif ONLY that way, a picture alone does not (r51). After pushing, rerun with --base https://javakhanstudio.github.io/Crypto_en_visuel/. Never open a browser on Simon's desk.
CROSS-REFERENCES (r119): xref.js at the root is shared by the saga's episodes 1.2-1.6 (imported '../../xref.js'): it maps an episode number to its folder and default step (EPISODES) and links every « épisode N » mention in step text and card. A new episode or a renumbered step changes EPISODES there; tests/xref_links.py checks every link lands on a real step.
SHADOW ITEMS (r207): lib/shapes.js (root, imports ../vendor/three like the episodes) rebuilds Shadow's code-built items (server_rack, tower, laptop) from assets/shapes/<item>.json, written by tools/godot_bridge/export.gd (godot --headless --path /home/simon/Shadow -s ...). Shadow is READ, never written: a change it needs is a ticket on the shadow board. Re-export after Shadow changes an item; node tests/shapes_roundtrip.mjs checks part counts and names, and lab/shapes/ shows three.js beside Godot's render (tools/godot_bridge/render.gd in cage, then tools/godot_bridge/lab_shot.py).
"""

