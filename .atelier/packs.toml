[tags.encore-des-tours]
label = 'Épisode 1.6, Eve a encore des tours'
description = "Episode 1.6 of Crypto en visuel, Eve's last tricks (forged packet, replay) and what stops them (RSA-PSS signature, a number, AES-GCM), the attack-defense workshop, in encore-des-tours/"
under = "demo3d"        # an episode folder: Birth counts it as #demo3d (r2046)
context = """
EPISODE 1.6, Eve a encore des tours (the workshop's « Pour aller plus loin »), folder encore-des-tours/, last of the Two Generals saga (r89; valley, castles, riders and cast of deux-generaux/). Built from paquet-complet/ (same engine, same lib/saga-aes.js and lib/hmac.js, lib/rsa.js). 14 steps in 5 chapters: Eve forges a whole packet with Bob's public padlock and her own keys (« JE SUIS ALICE, DONNE-MOI LE CODE », P.FORGED) and Bob accepts it, since the HMAC proves « someone with the key » and the sender draws it; Alice signs; Eve signs with HER key, rejected; replay of a signed packet, accepted; n° 42 under the signature (Bob keeps the highest number, refuses one not above it; 42 → 43 breaks the signature); AES-GCM; a final packet (number, one key OAEP, nonce, GCM, signature); the attack-defense questions (i18n 'play'). js/sign.js is RSA-PSS (RFC 8017 EMSA-PSS, SHA-256, MGF1-SHA-256, salt 32 = padding.PSS.DIGEST_LENGTH) on lib/rsa.js; Alice's pair (S.ALICE) and Eve's (S.EVE) are RSA-2048 drawn once with openssl, salts fixed (S.SALT, SALT_N, SALT_EVE). js/gcm.js is AES-256-GCM (SP 800-38D, BigInt GHASH) on lib/aes.js's block. js/packet.js: bricks num, ek, iv, ct, tag, sig (P.BRICKS); signed(pkt) is what the signature covers (num ‖ ek ‖ iv ‖ ct ‖ tag); receive(pkt, {sig, last}) checks the signature first, then the number, then 1.5's three moves; forge, alice, replay, tamper, gcm, final. Riders: main.js ride({from: 'city'}) is Eve's own rider (Messenger forged, paused at her gate while she speaks, then rides to Bob); showcase gains 'e' (before Eve's city) and shrinks the stand on a tall screen (six bricks). Sandbox: Eve's trick (pass, flip, forge, replay) × Bob's defenses (signature, number); Alice always signs and numbers, an accepted forgery raises Bob's last number. Values (D4): tests/tours_values.mjs checks the signature against openssl dgst PSS, node and WebCrypto, GCM against node aes-256-gcm and WebCrypto, Eve's forgery opened outside by openssl + Python hmac, 