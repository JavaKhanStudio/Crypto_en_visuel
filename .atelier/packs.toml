context = """
EPISODE 1, Two Generals (Le problème des deux généraux), folder deux-generaux/ (the oldest episode, the others were built from its shape). deux-generaux/js/main.js wires the renderer and the three modes (story 17 steps, sandbox, quiz 8 questions); window.demo is the debug handle; sim.js the protocol and who-knows-what, ladder.js the knowledge ladder (text + 3D), messenger.js the riders. No tests/deux-generaux_story.py: the gate is shoot.py (it opens deux-generaux/ by default) plus tests/beam_*.py and tests/dawn_camp.py where they apply. Its quiz goes through Simon's review page with tools/quiz_review.py (r48/r49).
The cast: Arnaud (A, west), Bastien (B, east), Étienne (E, the city), « le Chroniqueur ». Names are under who: AND written inline in many fr/en strings; French agreement and the qu'/que elision in knows() follow them. Renaming is Simon's choice: ask first, r3: « I asked you to confirm with me first. ». The home also forwards the OLD root links (#story=N, #sandbox, #quiz, #shot=) here: that is #demo3d's to keep.
