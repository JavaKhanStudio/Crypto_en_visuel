context = """
WHAT (simonbedardprog r97, Simon 22 Oct, df7f741): besides GitHub Pages (the address the course gives, see #demo3d PUBLIC), this repo is served AS IS, no build, by the Cloudflare Worker 'ficelle' at https://simonbedardprog.com/ficelle/ (and www). wrangler.jsonc: assets.directory "." (the repo root), main worker/ficelle.js, routes simonbedardprog.com/ficelle* and www.simonbedardprog.com/ficelle* (a route runs before the simonbedardprog Worker's custom domain on the same host), workers_dev true. A path that is a file is served as itself; /ficelle/<path> is no file, so it reaches worker/ficelle.js, which strips /ficelle, asks ASSETS, and puts the prefix back on the assets' own redirects (/garde -> /garde/). .assetsignore keeps .git .atelier .claude out tools tests worker wrangler.jsonc README.md node_modules .wrangler __pycache__ off the web.
GOING LIVE is Simon's: Workers Builds (Cloudflare dashboard) deploys branch prod; he pushes it (git push origin main:prod). A session NEVER pushes prod and NEVER runs wrangler deploy; the dashboard side is his.
RULES: (1) every link stays RELATIVE: the site lives under /ficelle/, so a root-absolute /lib/..., src="/assets/...", import from '/...' or fetch('/...') lands on simonbedardprog.com/lib/ and breaks (check: grep -rnE "(src|href)=./[a-z]|from ./[a-z]|fetch\\(./[a-z]" --include=*.html --include=*.js --include=*.css . | grep -vE '^./(tools|tests|out|worker|vendor)/' finds nothing; the . stands for either quote). (2) a new top-level folder that is not for the web (tools, captures, scratch data) goes into .assetsignore in the same commit. (3) after touching wrangler.jsonc or worker/, run tools/probe_ficelle_worker.sh: it starts wrangler dev on a free port (nothing is deployed) and checks 14 paths (redirects, files, the 404s of tools/ tests/ README.md wrangler.jsonc .atelier/); every line must be ✓ and it ends 'ok.'; tools/probe_ficelle_worker.sh https://simonbedardprog.com checks the live site.
"""
