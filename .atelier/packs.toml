raw', 'encrypt', 'seal', 'lock' are ONE room 'alice' (aliceRoom) of four beats in ALICE's keep (door 'a'; ROOMS[name].door picks each room's window, enter and leave), out at 'ride'. Its beats run on ONE clock (OFF: a beat starts where the one before ended), so #story=5 straight in shows the moves before it done; rows top to bottom: os.urandom (AES key, HMAC key, IV pop out), AES-256-CBC (order + padding -> ciphertext), HMAC-SHA256 (IV ‖ ciphertext + HMAC key -> seal), RSA-2048-OAEP (64 key bytes + Bob's open padlock -> 256 bytes, the padlock snaps shut); props.js packet() at the right follows the row at work and gets each brick. buildRoom(scene, portrait, { rows: 40, cols: 80, cx: 7 }) (lib/room-parts.js, r485) takes a wider wall for it. tests/paquet_alice.py (one zoom for four steps, frame and bubble in the band, tiles = the card's rows, outputs shown and bricks counted at each beat's end, lang rebuild, #story=5 straight in) must say all ok.
