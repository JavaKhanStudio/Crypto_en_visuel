nterieur), and gets the episode logo. Do not put the words back in an episode. Check: python3 tests/credit_stamp.py <episode> (home whole, episode logo alone in the top bar, story/sandbox/quiz at 1440/1100/390/360, unoccluded, link) says all ok.
