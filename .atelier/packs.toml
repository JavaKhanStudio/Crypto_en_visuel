EPISODE 1.5, Le paquet complet (the four bricks in order, what students build and why), folder paquet-complet/, fifth of the Two Generals saga (r89: one brick of the workshop packet per episode; valley, castles, riders and cast of deux-generaux/). Built from cle-vallee/ (same engine, same aes.js, hmac.js, rsa.js). js/packet.js is the packet: send (send_message: Alice's four moves), tamper (Eve XORs byte i of one brick: 'ek', 'iv', 'ct', 'tag'), receive (receive_message: open the keys, check the seal, then decrypt; receive(pkt, false) is the common mistake, decrypt then check). The story's keys, IV and seed are 1.4's (P.STORY); main.py's scene (« Bonjour Bob ! » / 'Hello Bob!') is R.NEXT (P.SCENE); Eve's story byte is the first byte of the ciphertext, one bit (P.EVE). main.js showcase(at, bricks, mark) stands a big packet (props.js packet(), four boxes in the card's colours) by Alice's or Bob's castle, beside it on a wide screen and in front of it on a tall one (STANDS / TALL); the rider's cargo 'packet' turns the brick Eve changed red (ride({mark})). The four files and their functions (card view 'files', i18n 'files') and main.py's expected output (i18n 'term.lines') are the workshop's « Projet - … » slides 13-18 of the cryptographie deck, word for word: change them only with the deck. Values (D4): tests/paquet_values.mjs replays receive_message OUTSIDE the page on the page's packet (openssl enc -aes-256-cbc and pkeyutl OAEP SHA-256, Python's hmac.compare_digest) and against WebCrypto, every brick tampered, decrypt-first, the 336 bytes; tests/paquet_story.py (fr, then en) plays the rides, main.py's terminal and the sandbox. Facts on screen with a source: padding oracle (Vaudenay 2002), Python random predictable from 624 outputs (Mersenne Twister), RSA-250 829 bits (2020), RSA-2048 acceptable until 2030 (NIST SP 800-57). Episode 1.6 (encore-des-tours/) is Eve's other tricks (forged packet, replay, signature, AES-GCM); 1.5's last step links to it.
SHARED (the same in every episode pack of this board): the series « Crypto en visuel » / 'Crypto, Visualized' (r15) for the Cryptographie course, STATIC pages, no build step, repo ~/Documents/GitHub/deux-generaux. Stay inside your episode's folder: the root (index.html, home.js, home.css), vendor/ and the other episodes belong to #demo3d and their own tags; a change there needs a #demo3d ticket (atelier add --tags demo3d). three.js r170 is shared in vendor/ (importmap '../vendor/three/...'), never copied or upgraded from an episode. The episode's address /paquet-complet/ never moves (slide cards point to it); its number, slug and live: true are its EPISODES entry in home.js, its title and one-liner the ep['paquet-complet'] entries of home.js's fr AND en dicts, its row and section in README.md (keep the section true when you change the story, step count or quiz). Deep links: #story=N is a STEP of this episode, #sandbox, #quiz, ?lang=en, ?instant=1 (skips camera flights). The language is shared across the series through localStorage 'dg-lang'.
Every visible word is in paquet-complet/js/i18n.js (fr and en dicts), the quiz in paquet-complet/js/quiz-data.js. TRAP: a key missing from en silently shows the French text (raw() falls back to dicts.fr), so add every key to both. RULE (r80, Simon: « anywhere, ever in this project »): no visible word, FR or EN, story, card or quiz, refers to the slides or the course (« la diapositive », « the slide », « dans le cours »): the page stands on its own; say the fact itself. Code comments citing a slide as a source may stay. Check: python3 tests/no_slide_refs.py (scans every episode's i18n.js and quiz-data.js) says all ok. BUBBLES (r84): js/bubbles.js settle() moves each speech bubble off the others and off the ids in WALLS (top bar, modes, lang, sound, card, panels); a new fixed overlay a bubble must not cover goes into WALLS, and tests/bubble_room.py (every step, phone and desktop) must stay all ok. PHONE ROOM (r84, Simon's pick C): under 900px the top controls sit in two rows (title + FR/EN, then modes + sound, a grid in style.css) and the corner #card is folded to its title line (class folded, a tap on its h3 opens it, main.js); tests/card_dock.py checks both. Do not put a third row of controls back on a phone. The series label (i18n key 'series') links back to the home.
Values (D4): a crypto episode takes its numbers from the course deck's worked-example slides and computes them in-page with a real algorithm, checked by tests/paquet_values.mjs (node) when there is one; recompute a slide value before trusting it.
TRAP that happened (2bdb831): headless SwiftShader runs at a low frame rate, so a check like |u - end| < eps on per-frame motion is jumped over and the event never fires: test against a threshold (u >= .965), never a window. A per-letter await inside a 'quick' loop is a headless-speed killer: collapse it to one wait. For a mid-animation shot load ?instant=1, then set demo.stage.speed=1 and trigger the action.
PUBLIC: origin = github.com/JavaKhanStudio/Crypto_en_visuel, GitHub Pages from main at https://javakhanstudio.github.io/Crypto_en_visuel/ (a push publishes in about a minute); the course deck links to it, so a broken push breaks the course. Publishing is approved (r2): push your own commit to origin main once checked.
CROSS-REFERENCES (r119): « l'épisode 1.4 » / « episode 6 » in a step's text or the corner card is turned into a link by ../../xref.js linkify() (called in story.js render() and card.js renderCard()); it lands on the cited episode's default step (EPISODES in xref.js) unless the step names the one it means, refs: { '1.4': 9 }. A new mention needs no code, only the right step: python3 tests/xref_links.py must say all ok, and read the titles it prints.
Gate: serve the repo (python3 -m http.server 8793), then python3 tests/paquet_story.py (fr, then with en as 2nd arg) must pass, and tools/shoot.py out/name --page paquet-complet/ --hash '#story=N' prints page errors, which must be none. Attach the PNG to the ticket (atelier attach), and close a change Simon can see with atelier done --livrable "<what to look at, one line>": a ticket an agent filed reaches his Notif ONLY that way, a picture alone does not (r51). paquet-complet/vignette.jpg (640x360, tools/vignette.py paquet-complet --real-speed) is the home card: without it the home 404s. After pushing, rerun shoot.py with --base https://javakhanstudio.github.io/Crypto_en_visuel/. Never open a browser on Simon's desk.
"""

