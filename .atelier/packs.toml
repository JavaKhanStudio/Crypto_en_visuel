The cast: Alice (A, west), Bob (B, east), Eve (E, the city), « le Chroniqueur » (Simon r89: renamed from Arnaud/Bastien/Étienne by r92; Alice and Eve are women, so French agreement follows). Names are under who: AND written inline in many fr/en strings; French agreement and the qu'/que elision in knows() follow them. Renaming is Simon's choice: ask first, r3: « I asked you to confirm with me first. ». The home also forwards the OLD root links (#story=N, #sandbox, #quiz, #shot=) here: that is #demo3d's to keep.
SHARED (the same in every episode pack of this board): the series « Crypto en visuel » / 'Crypto, Visualized' (r15) for the Cryptographie course, STATIC pages, no build step, repo ~/Documents/GitHub/deux-generaux. Stay inside your episode's folder: the root (index.html, home.js, home.css), vendor/ and the other episodes belong to #demo3d and their own tags; a change there needs a #demo3d ticket (atelier add --tags demo3d). three.js r170 is shared in vendor/ (importmap '../vendor/three/...'), never copied or upgraded from an episode. The episode's address /deux-generaux/ never moves (slide cards point to it); its number, slug and live: true are its EPISODES entry in home.js, its title and one-liner the ep.deux-generaux entries of home.js's fr AND en dicts, its row and section in README.md (keep the section true when you change the story, step count or quiz). Deep links: #story=N is a STEP of this episode, #sandbox, #quiz, ?lang=en, ?instant=1 (skips camera flights). The language is shared across the series through localStorage 'dg-lang'.
Every visible word is in deux-generaux/js/i18n.js (fr and en dicts), the quiz in deux-generaux/js/quiz-data.js. TRAP: a key missing from en silently shows the French text (raw() falls back to dicts.fr), so add every key to both. RULE (r80, Simon: « anywhere, ever in this project »): no visible word, FR or EN, story, card or quiz, refers to the slides or the course (« la diapositive », « the slide », « dans le cours »): the page stands on its own; say the fact itself. Code comments citing a slide as a source may stay. Check: python3 tests/no_slide_refs.py (scans every episode's i18n.js and quiz-data.js) says all ok. BUBBLES (r84, r320): lib/bubbles.js (root, one for every episode, no copy in <ep>/js) settle() moves each speech bubble off the others and off the ids in WALLS (top bar, modes, lang, sound, card, panels, the credit logo); main.js builds new Bubbles(camera, { raw: i18n.raw }); an overlay of ONE episode a bubble must not cover goes in its walls: ['id'] option, a series-wide one into WALLS in lib/bubbles.js (and tests/bubble_room.py's list); 3D tags to keep off: bubbles.avoid = () => [sprites]. tests/bubble_room.py (every step, phone and desktop) must stay all ok. PHONE ROOM (r84, Simon's pick C): under 900px the top controls sit in two rows (title + FR/EN, then modes + sound, a grid in lib/episode.css) and the corner #card is folded to its title line (class folded, a tap on its h3 opens it, main.js); tests/card_dock.py checks both. Do not put a third row of controls back on a phone. The series label (i18n key 'series') links back to the home.
Values (D4): a crypto episode takes its numbers from the course deck's worked-example slides and computes them in-page with a real algorithm, checked by tests/deux-generaux_values.mjs (node) when there is one; recompute a slide value before trusting it.
TRAP that happened (2bdb831): a headless browser can run at a low frame rate (SwiftShader, tools/browser.py's CPU fallback, draws 3-5 fps), so a check like |u - end| < eps on per-frame motion is jumped over and the event never fires: test against a threshold (u >= .965), never a window. A per-letter await inside a 'quick' loop is a headless-speed killer: collapse it to one wait. For a mid-animation shot load ?instant=1, then set demo.stage.speed=1 and trigger the action.
