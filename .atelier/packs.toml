ct sheet: watch the animation before and after a change. Floating tags (props.js setTag) keep their screen size (sizeAttenuation off); the watchers' tags sit at body height so the bubbles keep the space over the heads. They are drawn without fog. On a phone (portrait) stage.js pinTags moves each watcher tag every frame, newest reader first, to the free spot nearest its watcher (clear of the cards, the panel, the bubbles, the place names, the other tags and, at step 12, the customers' addresses) and hides the ones with no room, and it hides a place name under a card, a bubble or another name (r226); so on a phone each watcher tag opens with whose it is (i18n tag.head, r344); the phone shots seenPhone, seenCafePhone (step 13) and vpnPhone (camera.js) are framed so the step's own tag finds room: python3 tests/vpn_tags.py [base] checks it, fr and en, step 12 also after « Envoyer » (Victor's crowd tag, the widest; vpnCrowdPhone frames it, r374; tools/vpn_crowd_phone_shot.py shows it). Gate: node tests/vpn_values.mjs (values against node:crypto, and every figure in i18n.js and quiz-data.js against net.js), python3 tests/vpn_story.py [base] [fr|en] (every action and six sandbox cases). The quiz (7) is a draft on Simon's review page (tools/quiz_review.py export vpn). Its home card, README row and section, and its place in the episode lists of tests/bubble_room.py, card_dock.py, home_links.py and xref.js ('10': ['vpn', 1]) were added by r221 (13aefda); a change to them is #demo3d's. Truth (D4): what the ISP / café Wi-Fi sees with and without the tunnel, and the limits (the VPN provider sees what the ISP no longer does; not anonymity), are the story's claims: keep them true.
