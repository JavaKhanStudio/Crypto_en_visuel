e episode's own builder, omit for light parts, or printable: false with why); lab/print/?ep=<slug> (admin, not linked from the home; on the board's Labs screen as print-scene) loads the episode in a hidden iframe, reads them, checks every piece with lib/print.js (open, flat, thin under 1 mm, floating) and downloads the ticked ones as a zip of STL (whole asset, one per piece named with its colour, PRINT.txt). REPAIR (r394): the export writes lib/print.js repair()'s pieces, not the raw ones: open pieces capped (a sheet thickened to 1 mm), thin ones widened to 1 mm, floating ones strutted to the nearest piece (or the bed), and an asset with ground: <y> in its list cut there so it stands flat (the castles: ground: 0; a figure's glow goes in omit: (d, obj) => [...]); each fix is a line of PRINT.txt, amber in the preview. tools/print_shot.py <out> --asset <id> [--base] shoots the preview, before/after. An episode shows in the page's list as soon as its print-assets.js exists (slugs read from home.js). One three.js mesh = one piece; a mirrored matrix flips the winding. Check: python3 tests/print_lab.py [base] [ep] says all ok. LABS (r196, Simon: « Why is the lab not visible in the lab section ?! »): a page under lab/ is registered in the commit that builds it, atelier lab add <name> --viewer site --arg path=lab/<dir>/ --tags <tag> --about "what it lets you judge"; atelier lab list must show it before done. Registered: shapes-bridge, parallax-theatre, print-scene, saga-doors (r425: lab/doors/, the Middle-earth castles' candidate room windows, zoomed in and out; tools/doors_shots.py shoots them at fixed points of the zoom), parallax-sky (r339: episode 1.1's valley with a parallax page for sky, lab/parallax-sky/compare.html; tools/parallax_sky_film.py shoots it with ?embed=1, because SwiftShader's page screenshot drops a backdrop that sits under an HTML overlay).
